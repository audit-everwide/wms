<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>停電備用位置圖</title>
<!-- 停電備用位置圖（F-20、R-52～R-54）：由倉儲管理系統自動產生，不要手動編輯。
     物料資料已加密（AES-256-GCM），輸入查看密碼後在手機上解密，密碼不會送到任何伺服器。 -->
<style>
:root {
  --bg: #e8ecf1; --card: #fff; --text: #1d2330; --muted: #5f6b7a; --line: #d3d9e1; --primary: #1f6feb; --danger: #c4320a;
  --empty: #dbe2ea; --empty-border: #a3afbe; --beam: #7d8a9b;
  --pallet-empty: #efe0c3; --pallet-border: #b08a52; --pallet-band: #f3e9d6;
  --raw-bg: #c9dcff; --raw-fg: #163f8f; --raw-bd: #4f84e8;
  --semi-bg: #c6ecd3; --semi-fg: #17643a; --semi-bd: #3a9e63;
  --prod-bg: #ffd9ad; --prod-fg: #8f4a06; --prod-bd: #e0882a;
  --other-bg: #e1d3f3; --other-fg: #5a3f80; --other-bd: #8d6bc2;
  --hl: #e11d48; --cell: 112px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); padding-bottom: 40px;
       font: 16px/1.45 system-ui, -apple-system, "Microsoft JhengHei", "PingFang TC", sans-serif; }
button, input { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* 輸入密碼 */
.lock { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.box { width: 100%; max-width: 420px; background: var(--card); border-radius: 16px; padding: 24px;
       box-shadow: 0 2px 8px rgba(16,24,40,.12); }
.box h1 { font-size: 22px; margin: 0 0 4px; }
.box .sub { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
.inp { width: 100%; font-size: 18px; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; }
.chk { display: flex; align-items: center; gap: 8px; margin: 12px 0; font-size: 15px; }
.go { width: 100%; border: 0; border-radius: 10px; background: var(--primary); color: #fff; padding: 13px; font-size: 18px; font-weight: 700; }
.go:disabled { opacity: .6; }
.err { color: var(--danger); font-weight: 600; margin-top: 10px; min-height: 1.4em; }
.note { font-size: 13px; color: var(--muted); margin-top: 14px; }

/* 主畫面 */
.top { position: sticky; top: 0; z-index: 20; background: #1d2330; color: #fff; padding: 10px 16px 10px; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.title { font-size: 18px; font-weight: 700; }
.forget { background: rgba(255,255,255,.12); border: 0; border-radius: 999px; padding: 4px 12px; font-size: 13px; color: #fff; }
.stamp { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: #fffaeb; color: #93370d; font-size: 15px; font-weight: 700; }
.stamp.old { background: #fee4e2; color: #b42318; }
.search { display: flex; gap: 6px; margin-top: 8px; }
.search input { flex: 1; min-width: 0; font-size: 16px; padding: 9px 12px; border-radius: 8px; border: 0; }
.search button { border: 0; border-radius: 8px; background: var(--primary); color: #fff; padding: 0 14px; font-weight: 600; }
.results { background: var(--card); box-shadow: 0 6px 16px rgba(0,0,0,.12); max-height: 50vh; overflow-y: auto; }
.r-head { display: flex; justify-content: space-between; padding: 8px 16px; font-size: 14px; color: var(--muted); border-bottom: 1px solid var(--line); }
.r-head button { border: 0; background: none; color: var(--primary); }
.r-item { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 10px 16px; }
.r-item b { display: block; }
.r-item small { color: var(--muted); }
.r-item .pos { color: var(--primary); font-size: 15px; }
.r-empty { padding: 14px 16px; color: #b54708; }
.zone-tabs { display: flex; gap: 8px; padding: 12px 16px 0; }
.zone-tab { flex: 1; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px; font-weight: 600; color: var(--muted); }
.zone-tab.on { background: #1d2330; color: #fff; border-color: #1d2330; }
.grid-wrap { overflow-x: auto; margin: 10px 12px 0; padding: 12px; background: var(--card); border-radius: 14px; }
.grid { display: grid; gap: 6px 5px; width: max-content; }
.g-col, .g-row { font-size: 13px; display: flex; align-items: center; justify-content: center; font-weight: 700; }
.g-col { height: 26px; border-radius: 6px; background: #eef1f5; }
.g-col.marker { background: #1d2330; color: #fff; }
.g-row { position: sticky; left: -12px; z-index: 2; background: var(--card); justify-content: flex-start; padding-left: 4px; width: 52px; box-shadow: -12px 0 0 var(--card); }
.g-row.pallet { background: var(--pallet-band); color: #6b4f22; border-radius: 6px; }
.g-ground { grid-column: 1 / -1; font-size: 12px; color: #8a6a3a; display: flex; align-items: center; gap: 8px; height: 20px; }
.g-ground::before, .g-ground::after { content: ""; flex: 1; border-top: 2px dashed #c8ad80; }
.cell { position: relative; width: var(--cell); height: 84px; border-radius: 7px; border: 1.5px solid var(--empty-border); background: var(--empty);
        box-shadow: 0 3px 0 0 var(--beam); padding: 3px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
.cell.pallet { box-shadow: none; background: var(--pallet-empty); border: 1.5px dashed var(--pallet-border); }
.cell.full { border: 3px solid #1d2330; }
.cell.hl { outline: 3px solid var(--hl); outline-offset: 2px; z-index: 1; }
.cell.c-raw { background: var(--raw-bg); color: var(--raw-fg); border-color: var(--raw-bd); }
.cell.c-semi { background: var(--semi-bg); color: var(--semi-fg); border-color: var(--semi-bd); }
.cell.c-prod { background: var(--prod-bg); color: var(--prod-fg); border-color: var(--prod-bd); }
.cell.c-other { background: var(--other-bg); color: var(--other-fg); border-color: var(--other-bd); }
.mini { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 3px; width: 100%; height: 100%; }
.mini i { border-radius: 3px; background: rgba(255,255,255,.55); border: 1px solid rgba(29,35,48,.18); display: flex; align-items: center; justify-content: center; overflow: hidden; min-width: 0; }
.mini i.m-raw { background: var(--raw-bd); } .mini i.m-semi { background: var(--semi-bd); }
.mini i.m-prod { background: var(--prod-bd); } .mini i.m-other { background: var(--other-bd); }
em { font-style: normal; font-weight: 700; line-height: 1.15; word-break: keep-all; overflow-wrap: anywhere;
     display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mini em { font-size: 12px; color: #fff; text-align: center; text-shadow: 0 1px 1px rgba(0,0,0,.25); }
.nms { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; max-width: 100%; }
.nms small { font-size: 11px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 10px 16px 0; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 4px; }
.foot { margin: 14px 16px 0; padding: 12px; border-radius: 10px; background: #fff; border-left: 5px solid #f79009; font-size: 15px; }

/* 明細 */
.sheet-bg { position: fixed; inset: 0; background: rgba(16,24,40,.45); z-index: 50; display: flex; align-items: flex-end; }
.sheet { width: 100%; max-height: 80vh; overflow-y: auto; background: #fff; border-radius: 16px 16px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
.sheet h2 { margin: 0 0 2px; font-size: 20px; }
.sheet .sub { color: var(--muted); font-size: 14px; margin-bottom: 10px; }
.row { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; display: flex; gap: 10px; align-items: center; }
.row .grow { flex: 1; min-width: 0; }
.row .nm { font-weight: 700; font-size: 17px; word-break: break-all; }
.row .bt { font-size: 14px; color: var(--muted); }
.row .qt { font-weight: 600; white-space: nowrap; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 4px; padding: 0 5px; margin-right: 4px; }
.close { width: 100%; margin-top: 6px; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 12px; font-weight: 600; }
</style>
</head>
<body>
<section class="lock" id="lock">
  <div class="box">
    <h1>停電備用位置圖</h1>
    <div class="sub">系統打不開時使用・只能查看，不能入庫出庫</div>
    <div class="stamp" id="lockStamp"></div>
    <form id="pwForm" style="margin-top:14px">
      <input class="inp" id="pw" type="password" placeholder="輸入查看密碼" autocomplete="current-password" required>
      <label class="chk"><input type="checkbox" id="remember" checked> 這支手機記住密碼</label>
      <button class="go" id="goBtn" type="submit">開啟</button>
      <div class="err" id="err"></div>
    </form>
    <div class="note">密碼只在這支手機上用來解開資料，不會傳到任何地方。忘記密碼請找系統負責人。</div>
  </div>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="top-row"><div class="title">停電備用位置圖</div><button class="forget" id="forget" type="button">不再記住密碼</button></div>
    <div class="stamp" id="stamp"></div>
    <form class="search" id="sForm" autocomplete="off">
      <input id="q" type="search" placeholder="輸入品名或批號" enterkeyhint="search"><button type="submit">查詢</button>
    </form>
  </header>
  <div class="results" id="results" hidden></div>
  <div class="zone-tabs" id="tabs"></div>
  <div class="legend">
    <span><i style="background:var(--raw-bd)"></i>原料</span><span><i style="background:var(--semi-bd)"></i>半成品</span>
    <span><i style="background:var(--prod-bd)"></i>成品</span><span><i style="background:var(--other-bd)"></i>其他</span>
    <span><i style="background:#fff;border:3px solid #1d2330"></i>滿</span>
  </div>
  <div class="grid-wrap" id="wrap"><div class="grid" id="grid"></div></div>
  <div class="foot">⚠ 停電期間拿料、移動請<b>記在紙上</b>（品名、批號、數量、從哪裡、到哪裡），復電後補登進系統。</div>
</div>
<div class="sheet-bg" id="sheetBg" hidden><div class="sheet" id="sheet"></div></div>

const KEY_STORE = "wms_map_key";
const PALLET_UP = "棧板上", PALLET_DOWN = "棧板下";
const SLOT_NAMES = { 1: "前左", 2: "前右", 3: "後左", 4: "後右" };
const SLOT_ORDER = [3, 4, 1, 2];
const COLORS = { raw: ["var(--raw-bg)", "var(--raw-fg)"], semi: ["var(--semi-bg)", "var(--semi-fg)"],
                 prod: ["var(--prod-bg)", "var(--prod-fg)"], other: ["var(--other-bg)", "var(--other-fg)"] };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nb = s => esc(s).replace(/-/g, "‑");  // 品名不要在「-」處斷行
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const catKey = c => c === "原料" ? "raw" : c === "半成品" ? "semi" : c && c.startsWith("成品") ? "prod" : "other";
const V = { data: null, zone: null, hl: new Set() };

/* ---------------- 備份時間（R-52）：超過 1 天變紅 */
function stampHTML() {
  const t = BACKUP && BACKUP.time;
  if (!t) return "尚無備份資料";
  const age = (Date.now() - new Date(t.replace(" ", "T")).getTime()) / 3600000;
  const md = t.slice(5).replace("-", "/");
  return age > 24 ? `備份時間：${md}（已超過 1 天，位置可能已變動）`
                  : `備份時間：${md}　之後的入庫、出庫、移位沒有包含在內`;
}
function isOld() {
  return BACKUP && (Date.now() - new Date(BACKUP.time.replace(" ", "T")).getTime()) / 3600000 > 24;
}

/* ---------------- 解密（R-53）：PBKDF2-SHA256 → AES-256-GCM，全部在手機上做 */
async function keyFromPassword(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64(BACKUP.salt), iterations: BACKUP.iter }, base, 256);
  return new Uint8Array(bits);
}
async function decrypt(raw) {
  const k = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(BACKUP.nonce) }, k, b64(BACKUP.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
const toB64 = u8 => btoa(String.fromCharCode(...u8));
function loadStored() {
  try { const s = JSON.parse(localStorage.getItem(KEY_STORE) || "null"); return s && s.salt === BACKUP.salt ? b64(s.key) : null; }
  catch (e) { return null; }
}
function store(raw) { try { localStorage.setItem(KEY_STORE, JSON.stringify({ salt: BACKUP.salt, key: toB64(raw) })); } catch (e) {} }
function forget() { try { localStorage.removeItem(KEY_STORE); } catch (e) {} }

async function start() {
  $("lockStamp").textContent = stampHTML();
  $("lockStamp").classList.toggle("old", !!isOld());
  if (!BACKUP) { $("pw").disabled = $("goBtn").disabled = true; return; }
  if (!window.crypto || !crypto.subtle) { $("err").textContent = "這個瀏覽器不支援，請改用 Chrome 或 Safari 開啟"; return; }
  const saved = loadStored();
  if (saved) {
    try { return open(await decrypt(saved)); } catch (e) { forget(); }
  }
  $("pwForm").onsubmit = async ev => {
    ev.preventDefault();
    $("err").textContent = ""; $("goBtn").disabled = true; $("goBtn").textContent = "解開中…";
    try {
      const raw = await keyFromPassword($("pw").value);
      const data = await decrypt(raw);
      if ($("remember").checked) store(raw); else forget();
      open(data);
    } catch (e) {
      $("err").textContent = "密碼錯誤，請再試一次";
      $("pw").select();
    } finally { $("goBtn").disabled = false; $("goBtn").textContent = "開啟"; }
  };
}

/* ---------------- 架位圖（同 4.2.3 顯示品名） */
function open(data) {
  V.data = data;
  V.zone = Object.keys(data.zones)[0];
  V.slot = new Set(data.slot_mode); V.full = new Set(data.full);
  $("lock").hidden = true; $("app").hidden = false;
  $("stamp").textContent = stampHTML();
  $("stamp").classList.toggle("old", !!isOld());
  $("forget").onclick = () => { forget(); alert("這支手機已不再記住密碼，下次開啟需重新輸入。"); };
  $("sForm").onsubmit = ev => { ev.preventDefault(); $("q").blur(); search($("q").value.trim()); };
  render();
}
const rowsAt = (z, c, l) => V.data.stock.filter(r => r.zone === z && r.col === c && r.level === l);
function render() {
  const d = V.data, z = V.zone, n = d.zones[z], mk = new Set(d.markers[z] || []);
  $("tabs").innerHTML = Object.keys(d.zones).map(k => `<button class="zone-tab ${k === z ? "on" : ""}" data-z="${k}">${k} 區</button>`).join("");
  $("tabs").querySelectorAll("[data-z]").forEach(b => b.onclick = () => { V.zone = b.dataset.z; render(); });
  const g = $("grid");
  g.style.gridTemplateColumns = `52px repeat(${n}, var(--cell))`;
  let h = `<div></div>`;
  for (let c = 1; c <= n; c++) h += `<div class="g-col ${mk.has(c) ? "marker" : ""}">${z}${c}</div>`;
  d.levels.forEach(lv => {
    if (lv === PALLET_UP) h += `<div class="g-ground">地面（前方棧板）</div>`;
    const pallet = lv === PALLET_UP || lv === PALLET_DOWN;
    h += `<div class="g-row ${pallet ? "pallet" : ""}">${lv}</div>`;
    for (let c = 1; c <= n; c++) h += cell(z, c, lv, pallet);
  });
  g.innerHTML = h;
  g.querySelectorAll(".cell").forEach(b => b.onclick = () => detail(b.dataset.z, +b.dataset.c, b.dataset.l));
}
function cell(z, c, lv, pallet) {
  const k = `${z}-${c}-${lv}`, rows = rowsAt(z, c, lv), cls = ["cell"];
  if (pallet) cls.push("pallet");
  if (V.full.has(k)) cls.push("full");
  if (V.hl.has(k)) cls.push("hl");
  let inner = "";
  if (V.slot.has(k)) {
    inner = `<span class="mini">${SLOT_ORDER.map(s => {
      const r = rows.find(x => x.slot === s);
      return `<i class="${r ? "m-" + catKey(r.category) : ""}">${r ? `<em>${nb(r.name)}</em>` : ""}</i>`;
    }).join("")}</span>`;
  } else if (rows.length) {
    const ks = [...new Set(rows.map(r => catKey(r.category)))];
    cls.push("c-" + ks[0]);
    const nms = [...new Set(rows.map(r => r.name))];
    inner = `<span class="nms">${nms.slice(0, 2).map(x => `<em>${nb(x)}</em>`).join("")}${nms.length > 2 ? `<small>+${nms.length - 2}</small>` : ""}</span>`;
  }
  return `<button class="${cls.join(" ")}" data-z="${z}" data-c="${c}" data-l="${lv}">${inner}</button>`;
}
function rowHTML(r) {
  const [bg, fg] = COLORS[catKey(r.category)];
  return `<div class="row"><div class="grow"><div class="nm">${esc(r.name)}</div>
    <div class="bt"><span class="tag" style="background:${bg};color:${fg}">${esc(r.category)}</span>批號 ${esc(r.batch)}${r.slot ? `・${SLOT_NAMES[r.slot]}` : ""}</div></div>
    <div class="qt">${r.qty} SET</div></div>`;
}
function detail(z, c, l) {
  const rows = rowsAt(z, c, l).sort((a, b) => (a.slot || 0) - (b.slot || 0));
  const hint = rows[0] ? rows[0].hint : "";
  $("sheet").innerHTML = `<h2>${z}${c}・${l}</h2><div class="sub">${esc(hint)}${hint ? "・" : ""}備份當時的內容</div>
    ${rows.length ? rows.map(rowHTML).join("") : `<div class="sub">備份時這個位置沒有物料</div>`}
    <button class="close" id="close">關閉</button>`;
  $("sheetBg").hidden = false;
  $("close").onclick = () => { $("sheetBg").hidden = true; };
}
$("sheetBg").onclick = e => { if (e.target === $("sheetBg")) $("sheetBg").hidden = true; };

/* ---------------- 查詢：品名或批號（忽略「-」、空白、大小寫，同 R-31） */
function search(q) {
  const box = $("results");
  if (!q) { box.hidden = true; V.hl = new Set(); return render(); }
  const norm = s => String(s || "").replace(/[-\s]/g, "").toLowerCase();
  const nq = norm(q);
  const hits = V.data.stock.filter(r => norm(r.name).includes(nq) || norm(r.batch).includes(nq))
    .sort((a, b) => a.name.localeCompare(b.name) || a.batch.localeCompare(b.batch));
  box.hidden = false;
  box.innerHTML = `<div class="r-head"><span>「${esc(q)}」找到 ${hits.length} 筆</span><button id="rClose">關閉</button></div>` +
    (hits.length ? hits.map((r, i) => `<button class="r-item" data-i="${i}"><b>${esc(r.name)}</b>
      <small>${esc(r.category)}・批號 ${esc(r.batch)}・${r.qty} SET</small><div class="pos">${esc(r.position)}　${esc(r.hint)}</div></button>`).join("")
      : `<div class="r-empty">備份資料裡找不到，請到現場確認</div>`);
  $("rClose").onclick = () => search("");
  V.hl = new Set(hits.map(r => `${r.zone}-${r.col}-${r.level}`));
  render();
  box.querySelectorAll("[data-i]").forEach(b => b.onclick = () => {
    const r = hits[+b.dataset.i];
    box.hidden = true;
    V.zone = r.zone; V.hl = new Set([`${r.zone}-${r.col}-${r.level}`]); render();
    const el = document.querySelector(`.cell[data-z="${r.zone}"][data-c="${r.col}"][data-l="${r.level}"]`);
    if (el) el.scrollIntoView({ block: "center", inline: "center", behavior: "smooth" });
  });
}

start();
</script>
